# Configuration for "kubeadm init" on the first control plane node.
#
#   sudo kubeadm init --config bootstrap/kubeadm-config.yaml
#
# The values below are those of node-01. They mirror what the running
# cluster stores in the ConfigMaps kubeadm-config and kubelet-config:
#
#   kubectl -n kube-system get cm kubeadm-config -o jsonpath='{.data.ClusterConfiguration}'
#
# This file contains no secrets. Tokens and certificates are generated by
# kubeadm at init time and must never be added here.
apiVersion: kubeadm.k8s.io/v1beta4
kind: InitConfiguration
localAPIEndpoint:
  # Without this kubeadm picks the address of the default route. Set
  # explicitly because the node has two network cards.
  advertiseAddress: 192.168.1.51
  bindPort: 6443
nodeRegistration:
  name: node-01
  # An empty list registers the node without the control plane taint, so
  # that ordinary pods are scheduled on it. Leaving the field out would add
  # the taint.
  taints: []
  kubeletExtraArgs:
    - name: node-ip
      value: "192.168.1.51"
---
apiVersion: kubeadm.k8s.io/v1beta4
kind: ClusterConfiguration
# Must match the installed kubeadm package (ansible/vars/common.yaml).
kubernetesVersion: v1.35.6
controlPlaneEndpoint: 192.168.1.51:6443
networking:
  podSubnet: 10.244.0.0/16
  serviceSubnet: 10.96.0.0/12
apiServer:
  certSANs:
    - 192.168.1.51
    - node-01
# Cilium replaces kube-proxy (kubeProxyReplacement in
# components/cilium/values.yaml).
proxy:
  disabled: true
---
apiVersion: kubelet.config.k8s.io/v1beta1
kind: KubeletConfiguration
# Graceful node shutdown: pods get up to 90 s, the last 30 s belong to
# critical pods such as etcd. systemd-logind must allow at least the first
# value (logind_inhibit_delay in ansible/vars/common.yaml).
shutdownGracePeriod: 120s
shutdownGracePeriodCriticalPods: 30s
