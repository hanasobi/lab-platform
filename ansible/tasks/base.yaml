- name: Install base packages
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - ca-certificates
      - conntrack
      - curl
      - ebtables
      - ethtool
      - git
      - gnupg
      - gpg
      - htop
      - ipset
      - lm-sensors
      - lvm2
      - socat
      - vim
      - wget
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Set the time zone
  community.general.timezone:
    name: "{{ timezone }}"

# kubelet refuses to start while swap is active.
- name: Look for active swap
  ansible.builtin.command: swapon --noheadings --show=NAME
  register: swap_active
  changed_when: false
  check_mode: false

- name: Turn swap off
  ansible.builtin.command: swapoff -a
  when: swap_active.stdout | length > 0
  changed_when: true

- name: Keep swap off after a reboot
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^([^#\n].*\sswap\s.*)$'
    replace: '#\1'

- name: Remove the swap file of the installer
  ansible.builtin.file:
    path: /swap.img
    state: absent

- name: Load kernel modules at boot
  ansible.builtin.copy:
    dest: /etc/modules-load.d/k8s.conf
    content: |
      overlay
      br_netfilter
    owner: root
    group: root
    mode: "0644"

- name: Load kernel modules now
  community.general.modprobe:
    name: "{{ item }}"
    state: present
  loop:
    - overlay
    - br_netfilter

- name: Configure sysctl for Kubernetes networking
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-kubernetes.conf
    content: |
      net.bridge.bridge-nf-call-iptables  = 1
      net.bridge.bridge-nf-call-ip6tables = 1
      net.ipv4.ip_forward                 = 1
    owner: root
    group: root
    mode: "0644"
  notify: Apply sysctl settings
