apiVersion: v1
kind: Namespace
metadata:
  name: gateway
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: lab
  namespace: gateway
spec:
  gatewayClassName: cilium
  addresses:
    - type: IPAddress
      value: 192.168.1.240
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: "*.lab.home.arpa"
      allowedRoutes:
        namespaces:
          from: All
