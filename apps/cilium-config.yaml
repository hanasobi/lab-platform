apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cilium-config
  namespace: argocd
spec:
  project: platform
  source:
    repoURL: https://github.com/hanasobi/lab-platform.git
    targetRevision: main
    path: components/cilium/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
