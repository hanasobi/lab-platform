apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateway-api-crds
  namespace: argocd
spec:
  project: platform
  source:
    repoURL: https://github.com/hanasobi/lab-platform.git
    targetRevision: main
    path: components/gateway-api-crds
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
